<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9f1d20">
    <title>Demandas Express — Sistema Completo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
        :root {
            --primary: #b3262b;
            --primary-hover: #8f171c;
            --ink: #451416;
            --bg: #fff8e7;
            --surface: #fffdf7;
            --text: #3f2521;
            --text-muted: #80645d;
            --border: #ead5b0;
            --success: #2f7a3b;
            --warning: #bd5d16;
            --danger: #a9161d;
            --yellow: #f3bd32;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DM Sans"; }
        body {
            background: linear-gradient(135deg, #a3262b 0%, #5e0f13 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            display: flex;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            gap: 0;
            height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: rgba(255,248,231,.95);
            border-right: 1px solid var(--border);
            padding: 1rem;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,.1);
        }
        .sidebar h2 {
            font-family: "Manrope";
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: var(--ink);
        }
        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .sidebar-btn {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            text-align: left;
        }
        .sidebar-btn:hover { background: var(--yellow-soft); transform: translateX(4px); }
        .sidebar-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }
        .header {
            background: rgba(255,248,231,.95);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        .header h1 { font-family: "Manrope"; font-size: 1.5rem; color: var(--ink); }
        .header-controls { display: flex; gap: 0.5rem; align-items: center; }
        .user-badge {
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }
        button {
            padding: 0.7rem 1.2rem;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        button.secondary:hover { background: var(--yellow-soft); }
        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            background: white;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            padding: 1rem;
        }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        .modal-content h2 { font-family: "Manrope"; font-size: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
        .form-group label { font-weight: 600; color: var(--text); font-size: 0.9rem; }
        .form-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
            transition: all 0.3s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,.15); }
        .card-image {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            overflow: hidden;
        }
        .card-image img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
        .card-content { padding: 1.2rem; }
        .card-title { font-family: "Manrope"; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .card-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .card-desc { font-size: 0.9rem; color: var(--text); line-height: 1.5; margin-bottom: 1rem; }
        .badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .badge-pending { background: var(--yellow); color: #7c430b; }
        .badge-done { background: var(--success); color: white; }
        .badge-review { background: var(--warning); color: white; }
        .card-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .card-actions button { flex: 1; min-width: 120px; font-size: 0.8rem; padding: 0.6rem; }
        .stat-box {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
        }
        .stat-box .num { font-family: "Manrope"; font-size: 2.5rem; font-weight: 800; color: var(--primary); }
        .stat-box .label { font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; margin-top: 0.5rem; }
        .ranking { list-style: none; }
        .ranking-item {
            background: white;
            border-radius: 8px;
            border-left: 4px solid var(--yellow);
            padding: 1rem;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ranking-item.top1 { border-left-color: #ffd700; }
        .ranking-item.top2 { border-left-color: #c0c0c0; }
        .ranking-item.top3 { border-left-color: #cd7f32; }
        .ranking-pos { font-family: "Manrope"; font-weight: 800; font-size: 1.2rem; }
        .ranking-name { flex: 1; margin: 0 1rem; }
        .ranking-xp { font-family: "Manrope"; font-weight: 800; font-size: 1.1rem; color: var(--primary); }
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .lightbox.active { display: flex; }
        .lightbox img { max-width: 90%; max-height: 90vh; border-radius: 12px; }
        .hidden { display: none !important; }
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>⚡ Demandas</h2>
            <div class="sidebar-menu">
                <button class="sidebar-btn active" onclick="showView('minhas-demandas')">📋 Minhas Demandas</button>
                <button class="sidebar-btn" onclick="showView('criar-demanda')">➕ Criar Demanda</button>
                <button class="sidebar-btn" onclick="showView('todas-demandas')">📊 Todas Demandas</button>
                <button class="sidebar-btn" onclick="showView('ranking')">🏆 Ranking</button>
                <button class="sidebar-btn" onclick="showView('entregar')">✅ Entregar Trabalho</button>
                <button id="adminMenu" class="sidebar-btn hidden" onclick="showView('admin')">⚙️ Painel ADM</button>
                <button class="sidebar-btn" onclick="logout()" style="margin-top: 1rem; background: #f9d9d5; color: var(--danger);">🚪 Sair</button>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 id="pageTitle">Minhas Demandas</h1>
                <div class="header-controls">
                    <div class="user-badge" id="userBadge">Usuário</div>
                </div>
            </div>

            <div class="content" id="mainContent">
                <!-- Conteúdo dinâmico aqui -->
            </div>
        </div>
    </div>

    <!-- Modal de Login -->
    <div id="loginModal" class="modal active">
        <div class="modal-content">
            <h2>Bem-vindo ao Demandas Express</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Selecione seu nome para entrar</p>
            <div id="userList" class="grid"></div>
            <div style="margin-top: 1rem;">
                <button onclick="showAdminLogin()" class="secondary" style="width: 100%;">🔐 Acesso ADM</button>
            </div>
        </div>
    </div>

    <!-- Modal de Login ADM -->
    <div id="adminLoginModal" class="modal">
        <div class="modal-content">
            <h2>Acesso Administrador</h2>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="adminPin" placeholder="Digite a senha do ADM">
            </div>
            <div class="form-actions">
                <button onclick="closeModal('adminLoginModal')" class="secondary">Voltar</button>
                <button onclick="loginAdmin()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Criar Demanda -->
    <div id="criarDemandaModal" class="modal">
        <div class="modal-content">
            <h2>Criar Nova Demanda</h2>
            <div class="form-group">
                <label>Atribuído para</label>
                <select id="demandaAssignedTo"></select>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="demandaDesc" rows="4" placeholder="Descreva a demanda..."></textarea>
            </div>
            <div class="form-group">
                <label>Prioridade</label>
                <select id="demandaPriority">
                    <option value="BAIXA">Baixa</option>
                    <option value="NORMAL" selected>Normal</option>
                    <option value="ALTA">Alta</option>
                    <option value="URGENTE">Urgente</option>
                </select>
            </div>
            <div class="form-group">
                <label>Foto da Instrução</label>
                <input type="file" id="demandaPhoto" accept="image/*">
            </div>
            <div class="form-actions">
                <button onclick="closeModal('criarDemandaModal')" class="secondary">Cancelar</button>
                <button onclick="saveDemanda()">Criar Demanda</button>
            </div>
        </div>
    </div>

    <!-- Modal de Entregar -->
    <div id="entregarModal" class="modal">
        <div class="modal-content">
            <h2>Enviar Resultado</h2>
            <div class="form-group">
                <label>Demanda</label>
                <select id="entregarTaskId"></select>
            </div>
            <div class="form-group">
                <label>Observações</label>
                <textarea id="entregarNotas" rows="3" placeholder="Descreva o que foi feito..."></textarea>
            </div>
            <div class="form-group">
                <label>Foto do Resultado</label>
                <input type="file" id="entregarPhoto" accept="image/*">
            </div>
            <div class="form-actions">
                <button onclick="closeModal('entregarModal')" class="secondary">Cancelar</button>
                <button onclick="submitEntrega()">Entregar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Aprovação (ADM) -->
    <div id="aprovaModal" class="modal">
        <div class="modal-content">
            <h2>Aprovar Entrega</h2>
            <div id="aprovaContent"></div>
            <div class="form-group">
                <label>Observação</label>
                <textarea id="aprovaObs" rows="2"></textarea>
            </div>
            <div class="form-actions">
                <button onclick="rejectEntrega()" class="secondary">Rejeitar</button>
                <button onclick="approveEntrega()" style="background: var(--success);">Aprovar</button>
            </div>
        </div>
    </div>

    <!-- Lightbox para Fotos -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="">
    </div>

    <script>
        const ADMIN_PIN = "1234";
        let currentUser = null;
        let isAdmin = false;
        let users = [];
        let tasks = [];
        let deliveries = [];
        let currentView = 'minhas-demandas';
        let selectedDeliveryId = null;

        // Sistema de dados
        const DB = {
            init() {
                const stored = localStorage.getItem('demandas-db');
                if (stored) {
                    try {
                        const data = JSON.parse(stored);
                        users = data.users || [];
                        tasks = data.tasks || [];
                        deliveries = data.deliveries || [];
                    } catch (e) {
                        this.reset();
                    }
                } else {
                    this.reset();
                }
            },
            reset() {
                users = [
                    { id: '1', name: 'Gabriel', active: true },
                    { id: '2', name: 'Maria', active: true },
                    { id: '3', name: 'João', active: true }
                ];
                tasks = [];
                deliveries = [];
                this.save();
            },
            save() {
                localStorage.setItem('demandas-db', JSON.stringify({ users, tasks, deliveries }));
            },
            addUser(name) {
                users.push({ id: Date.now().toString(), name, active: true });
                this.save();
            },
            addTask(assignedTo, description, priority, photo) {
                tasks.push({
                    id: Date.now().toString(),
                    createdBy: currentUser.id,
                    assignedTo,
                    description,
                    priority,
                    photo,
                    status: 'PENDENTE',
                    createdAt: new Date().toISOString()
                });
                this.save();
            },
            submitEntrega(taskId, notes, photo) {
                deliveries.push({
                    id: Date.now().toString(),
                    taskId,
                    userId: currentUser.id,
                    notes,
                    photo,
                    status: 'AGUARDANDO',
                    submittedAt: new Date().toISOString()
                });
                const task = tasks.find(t => t.id === taskId);
                if (task) task.status = 'AGUARDANDO_APROVACAO';
                this.save();
            },
            approveDelivery(deliveryId, obs) {
                const delivery = deliveries.find(d => d.id === deliveryId);
                if (delivery) {
                    delivery.status = 'APROVADO';
                    delivery.approvedAt = new Date().toISOString();
                    delivery.approverObs = obs;
                    const task = tasks.find(t => t.id === delivery.taskId);
                    if (task) {
                        task.status = 'CONCLUÍDO';
                        const xpTable = { BAIXA: 60, NORMAL: 100, ALTA: 140, URGENTE: 200 };
                        delivery.xp = xpTable[task.priority] || 100;
                    }
                    this.save();
                }
            },
            rejectDelivery(deliveryId, obs) {
                const delivery = deliveries.find(d => d.id === deliveryId);
                if (delivery) {
                    delivery.status = 'REJEITADO';
                    delivery.rejecterObs = obs;
                    const task = tasks.find(t => t.id === delivery.taskId);
                    if (task) task.status = 'PENDENTE';
                    this.save();
                }
            }
        };

        function init() {
            DB.init();
            if (currentUser) {
                closeModal('loginModal');
                showView('minhas-demandas');
            } else {
                renderLoginUsers();
            }
        }

        function renderLoginUsers() {
            const html = users.map(u => `
                <button onclick="loginUser('${u.id}')" style="padding: 1.5rem; background: white; border: 2px solid var(--border); color: var(--text);">
                    <div style="font-size: 2rem; margin-bottom: 0.5rem;">👤</div>
                    <div style="font-weight: 600;">${u.name}</div>
                </button>
            `).join('');
            document.getElementById('userList').innerHTML = html;
        }

        function loginUser(userId) {
            currentUser = users.find(u => u.id === userId);
            isAdmin = false;
            document.getElementById('adminMenu').classList.add('hidden');
            closeModal('loginModal');
            updateUI();
            showView('minhas-demandas');
        }

        function showAdminLogin() {
            openModal('adminLoginModal');
        }

        function loginAdmin() {
            const pin = document.getElementById('adminPin').value;
            if (pin === ADMIN_PIN) {
                isAdmin = true;
                currentUser = { id: 'admin', name: 'Administrador' };
                document.getElementById('adminMenu').classList.remove('hidden');
                closeModal('adminLoginModal');
                closeModal('loginModal');
                updateUI();
                showView('admin');
            } else {
                alert('PIN incorreto!');
            }
        }

        function logout() {
            currentUser = null;
            isAdmin = false;
            openModal('loginModal');
            renderLoginUsers();
        }

        function updateUI() {
            document.getElementById('userBadge').textContent = currentUser.name;
        }

        function showView(view) {
            currentView = view;
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            switch(view) {
                case 'minhas-demandas':
                    renderMinhasDemandas();
                    break;
                case 'criar-demanda':
                    renderCriarDemanda();
                    break;
                case 'todas-demandas':
                    renderTodasDemandas();
                    break;
                case 'ranking':
                    renderRanking();
                    break;
                case 'entregar':
                    renderEntregar();
                    break;
                case 'admin':
                    renderAdmin();
                    break;
            }
        }

        function renderMinhasDemandas() {
            document.getElementById('pageTitle').textContent = 'Minhas Demandas';
            const minhas = tasks.filter(t => t.assignedTo === currentUser.id);
            const html = `
                <h2 style="margin-bottom: 1.5rem;">Minhas Demandas Atribuídas</h2>
                <div class="grid">
                    ${minhas.map(task => renderTaskCard(task)).join('')}
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function renderTaskCard(task) {
            const creator = users.find(u => u.id === task.createdBy);
            const status = task.status === 'PENDENTE' ? 'badge-pending' : task.status === 'AGUARDANDO_APROVACAO' ? 'badge-review' : 'badge-done';
            return `
                <div class="card">
                    <div class="card-image">
                        ${task.photo ? `<img src="${task.photo}" onclick="openLightbox('${task.photo}')">` : '📄'}
                    </div>
                    <div class="card-content">
                        <div class="card-title">${task.description.substring(0, 30)}...</div>
                        <div class="card-meta">De: ${creator ? creator.name : 'Desconhecido'}</div>
                        <span class="badge ${status}">${task.status}</span>
                        ${task.priority && `<span class="badge" style="background: var(--warning); color: white;">${task.priority}</span>`}
                        <div style="margin-top: 1rem;">
                            ${task.status === 'PENDENTE' ? `<button onclick="openEntregarModal('${task.id}')" style="width: 100%;">✅ Entregar</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCriarDemanda() {
            document.getElementById('pageTitle').textContent = 'Criar Demanda';
            const assignSelect = document.getElementById('demandaAssignedTo');
            assignSelect.innerHTML = users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
            openModal('criarDemandaModal');
        }

        function renderTodasDemandas() {
            document.getElementById('pageTitle').textContent = 'Todas as Demandas';
            const html = `
                <h2 style="margin-bottom: 1.5rem;">Sistema de Demandas</h2>
                <div class="grid">
                    <div class="stat-box">
                        <div class="num">${tasks.filter(t => t.status === 'PENDENTE').length}</div>
                        <div class="label">Pendentes</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">${tasks.filter(t => t.status === 'AGUARDANDO_APROVACAO').length}</div>
                        <div class="label">Aguardando</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">${tasks.filter(t => t.status === 'CONCLUÍDO').length}</div>
                        <div class="label">Concluídas</div>
                    </div>
                </div>
                <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Todas as Demandas</h3>
                <div class="grid">
                    ${tasks.map(task => renderTaskCard(task)).join('')}
                </div>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function renderEntregar() {
            document.getElementById('pageTitle').textContent = 'Entregar Trabalho';
            const minhas = tasks.filter(t => t.assignedTo === currentUser.id && (t.status === 'PENDENTE' || t.status === 'AGUARDANDO_APROVACAO'));
            const select = document.getElementById('entregarTaskId');
            select.innerHTML = minhas.map(t => `<option value="${t.id}">${t.description.substring(0, 50)}</option>`).join('');
            openModal('entregarModal');
        }

        function renderRanking() {
            document.getElementById('pageTitle').textContent = 'Ranking XP';
            const userXp = {};
            deliveries.filter(d => d.status === 'APROVADO').forEach(d => {
                userXp[d.userId] = (userXp[d.userId] || 0) + (d.xp || 0);
            });
            const ranking = users.map(u => ({
                user: u,
                xp: userXp[u.id] || 0
            })).sort((a, b) => b.xp - a.xp);

            const html = `
                <h2 style="margin-bottom: 1.5rem;">🏆 Ranking da Equipe</h2>
                <ul class="ranking">
                    ${ranking.map((r, i) => `
                        <li class="ranking-item top${i + 1}">
                            <span class="ranking-pos">${i + 1}º</span>
                            <span class="ranking-name">${r.user.name}</span>
                            <span class="ranking-xp">${r.xp} XP</span>
                        </li>
                    `).join('')}
                </ul>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function renderAdmin() {
            document.getElementById('pageTitle').textContent = 'Painel Administrativo';
            const pendingDeliveries = deliveries.filter(d => d.status === 'AGUARDANDO');
            const html = `
                <h2 style="margin-bottom: 1.5rem;">⚙️ Painel do Administrador</h2>
                <div class="grid">
                    <div class="stat-box">
                        <div class="num">${tasks.length}</div>
                        <div class="label">Demandas Totais</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">${pendingDeliveries.length}</div>
                        <div class="label">Aguardando Aprovação</div>
                    </div>
                    <div class="stat-box">
                        <div class="num">${deliveries.filter(d => d.status === 'APROVADO').length}</div>
                        <div class="label">Entregas Aprovadas</div>
                    </div>
                </div>
                <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Entregas Pendentes de Aprovação</h3>
                ${pendingDeliveries.length > 0 ? `
                    <div class="grid">
                        ${pendingDeliveries.map(d => {
                            const task = tasks.find(t => t.id === d.taskId);
                            const user = users.find(u => u.id === d.userId);
                            return `
                                <div class="card">
                                    <div class="card-image">
                                        ${d.photo ? `<img src="${d.photo}" onclick="openLightbox('${d.photo}')">` : '📄'}
                                    </div>
                                    <div class="card-content">
                                        <div class="card-title">De: ${user ? user.name : 'Desconhecido'}</div>
                                        <div class="card-meta">Tarefa: ${task ? task.description.substring(0, 30) : 'Desconhecido'}...</div>
                                        <p style="font-size: 0.9rem; margin: 0.5rem 0;">${d.notes}</p>
                                        <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                                            <button onclick="openAprovaModal('${d.id}')" style="flex: 1; background: var(--success);">✅ Aprovar</button>
                                            <button onclick="rejectEntrega('${d.id}')" class="secondary" style="flex: 1;">❌ Rejeitar</button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : '<p style="text-align: center; color: var(--text-muted);">Nenhuma entrega aguardando aprovação</p>'}
                <h3 style="margin-top: 2rem; margin-bottom: 1rem;">Gerenciar Usuários</h3>
                <button onclick="openAddUserModal()" style="margin-bottom: 1rem;">➕ Adicionar Usuário</button>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function openEntregarModal(taskId) {
            selectedDeliveryId = null;
            document.getElementById('entregarTaskId').value = taskId;
            openModal('entregarModal');
        }

        function openAprovaModal(deliveryId) {
            selectedDeliveryId = deliveryId;
            const delivery = deliveries.find(d => d.id === deliveryId);
            const task = tasks.find(t => t.id === delivery.taskId);
            const user = users.find(u => u.id === delivery.userId);
            document.getElementById('aprovaContent').innerHTML = `
                <p><strong>Usuário:</strong> ${user.name}</p>
                <p><strong>Tarefa:</strong> ${task.description}</p>
                <p><strong>Notas:</strong> ${delivery.notes}</p>
                ${delivery.photo ? `<p><a href="#" onclick="openLightbox('${delivery.photo}'); return false;">Ver Foto ▶</a></p>` : ''}
            `;
            openModal('aprovaModal');
        }

        function saveDemanda() {
            const assignedTo = document.getElementById('demandaAssignedTo').value;
            const desc = document.getElementById('demandaDesc').value;
            const priority = document.getElementById('demandaPriority').value;
            const photo = document.getElementById('demandaPhoto');

            if (!assignedTo || !desc) {
                alert('Preencha todos os campos');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                DB.addTask(assignedTo, desc, priority, e.target.result);
                closeModal('criarDemandaModal');
                showView('todas-demandas');
            };

            if (photo.files[0]) {
                reader.readAsDataURL(photo.files[0]);
            } else {
                DB.addTask(assignedTo, desc, priority, null);
                closeModal('criarDemandaModal');
                showView('todas-demandas');
            }
        }

        function submitEntrega() {
            const taskId = document.getElementById('entregarTaskId').value;
            const notes = document.getElementById('entregarNotas').value;
            const photo = document.getElementById('entregarPhoto');

            if (!taskId || !notes) {
                alert('Preencha todos os campos');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                DB.submitEntrega(taskId, notes, e.target.result);
                closeModal('entregarModal');
                showView('minhas-demandas');
                alert('Entrega enviada para aprovação!');
            };

            if (photo.files[0]) {
                reader.readAsDataURL(photo.files[0]);
            } else {
                DB.submitEntrega(taskId, notes, null);
                closeModal('entregarModal');
                showView('minhas-demandas');
                alert('Entrega enviada para aprovação!');
            }
        }

        function approveEntrega() {
            const obs = document.getElementById('aprovaObs').value;
            DB.approveDelivery(selectedDeliveryId, obs);
            closeModal('aprovaModal');
            showView('admin');
            alert('Entrega aprovada com sucesso!');
        }

        function rejectEntrega(deliveryId) {
            const obs = document.getElementById('aprovaObs').value;
            DB.rejectDelivery(deliveryId, obs);
            closeModal('aprovaModal');
            showView('admin');
            alert('Entrega rejeitada!');
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.add('active');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }

        // Inicializar
        init();
    </script>
</body>
</html>

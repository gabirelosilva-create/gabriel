<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4a0c0e">
    <title>DEMANDAS EXPRESS — Gestão com Anexos e Ranking</title>
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #7a1518 0%, #3d080a 60%, #1f0304 100%);
            --card-bg: #fffdf7;
            --card-dark: #2e0608;
            --yellow-main: #f59e0b;
            --yellow-bright: #fbbf24;
            --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #fef08a 50%, #d97706 100%);
            --red-main: #b91c1c;
            --red-bright: #ef4444;
            --green-main: #10b981;
            --border: #fcd34d;
            --text-dark: #1c1917;
            --text-muted: #78353a;
            --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.4);
            --shadow-card: 0 4px 15px rgba(0, 0, 0, 0.06);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            color: var(--text-dark); 
            padding: 12px; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        .app-container { 
            width: 100%; 
            max-width: 620px; 
            background-color: #fffefa; 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            box-shadow: var(--shadow-lg); 
            border: 2px solid var(--border); 
            display: flex; 
            flex-direction: column; 
        }
        
        /* HEADER */
        .header { 
            background-color: var(--card-dark); 
            padding: 14px 18px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 2px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 50; 
            backdrop-filter: blur(10px);
        }
        
        .logo { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-family: 'Outfit', sans-serif;
            font-weight: 900; 
            font-size: 1.15rem; 
            color: #fff; 
            letter-spacing: -0.02em;
        }
        
        .logo span { color: var(--yellow-bright); }
        
        .sync-badge { 
            font-size: 0.68rem; 
            font-weight: 800; 
            padding: 4px 10px; 
            border-radius: 99px; 
            color: #fff; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sync-online { background-color: var(--green-main); box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .sync-offline { background-color: var(--red-bright); box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        .sync-syncing { background-color: var(--yellow-main); color: #000; }

        .user-selector select { 
            background: #fff; 
            border: 1px solid var(--border); 
            border-radius: var(--radius-sm); 
            padding: 6px 10px; 
            font-weight: 700; 
            cursor: pointer; 
            color: var(--text-dark); 
            outline: none; 
            font-size: 0.85rem;
        }

        .btn-pin { 
            background: var(--gold-gradient); 
            border: none; 
            padding: 6px 12px; 
            border-radius: var(--radius-sm); 
            font-weight: 800; 
            cursor: pointer; 
            color: #2e0608; 
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
            transition: transform 0.15s ease; 
        }
        .btn-pin:active { transform: scale(0.95); }

        /* HERO CARD */
        .hero-card { 
            background: linear-gradient(135deg, #3d080a 0%, #1f0304 100%); 
            margin: 14px; 
            padding: 16px; 
            border-radius: var(--radius-md); 
            border: 2px solid var(--border); 
            color: #fff; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.25); 
            position: relative;
            overflow: hidden;
        }
        
        .user-profile-header { display: flex; align-items: center; gap: 14px; }
        
        .avatar-frame { 
            width: 56px; 
            height: 56px; 
            background: var(--gold-gradient); 
            border-radius: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Outfit', sans-serif;
            font-size: 1.7rem; 
            font-weight: 900; 
            color: #2e0608; 
            position: relative; 
            flex-shrink: 0; 
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
        }
        
        .level-badge-floating { 
            position: absolute; 
            bottom: -8px; 
            background: var(--red-main); 
            color: #fff; 
            font-size: 0.6rem; 
            padding: 2px 7px; 
            border-radius: 10px; 
            font-weight: 800; 
            border: 1.5px solid var(--yellow-bright); 
            white-space: nowrap; 
        }

        .xp-container { margin-top: 14px; }
        .xp-bar-bg { background: rgba(255,255,255,0.12); height: 10px; border-radius: 99px; overflow: hidden; border: 1px solid rgba(251, 191, 36, 0.3); }
        .xp-bar-fill { background: var(--gold-gradient); height: 100%; width: 0%; transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .xp-stats { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 6px; color: #fde68a; font-weight: 600; }

        /* METRICS GRID */
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 14px; }
        .metric-card { 
            background: #fff; 
            border: 1.5px solid var(--border); 
            border-radius: var(--radius-md); 
            padding: 10px; 
            text-align: center; 
            box-shadow: var(--shadow-card);
            border-bottom: 3px solid var(--red-main);
        }
        .metric-card.gold { border-bottom-color: var(--yellow-main); }
        .metric-value { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--card-dark); }
        .metric-label { font-size: 0.65rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }

        /* TABS */
        .nav-tabs { display: flex; gap: 8px; padding: 14px; }
        .tab-btn { 
            flex: 1; 
            padding: 10px; 
            border: none; 
            border-radius: var(--radius-md); 
            font-weight: 800; 
            background: #fef3c7; 
            color: #78350f; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-size: 0.85rem;
        }
        .tab-btn.active { background: var(--red-main); color: #fff; box-shadow: 0 4px 12px rgba(185, 28, 28, 0.3); }

        .search-box { padding: 0 14px 10px; }
        .search-box input { 
            width: 100%; 
            padding: 9px 12px; 
            border: 1.5px solid var(--border); 
            border-radius: var(--radius-md); 
            font-size: 0.85rem; 
            outline: none; 
            background: #fff;
        }

        .filter-chips { display: flex; gap: 6px; padding: 0 14px 14px; overflow-x: auto; }
        .chip { 
            padding: 6px 14px; 
            border-radius: 99px; 
            background: #fff; 
            border: 1px solid var(--border); 
            font-size: 0.78rem; 
            font-weight: 700; 
            cursor: pointer; 
            white-space: nowrap; 
            color: var(--text-muted); 
            transition: all 0.15s ease;
        }
        .chip.active { background: var(--red-main); color: #fff; border-color: var(--red-main); }

        .tasks-container { padding: 0 14px 20px; display: flex; flex-direction: column; gap: 10px; }
        .task-card { 
            background: #fff; 
            border-radius: var(--radius-md); 
            padding: 14px; 
            border: 1px solid var(--border); 
            border-left: 6px solid var(--yellow-main); 
            box-shadow: var(--shadow-card); 
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .task-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
        .task-card.URGENTE { border-left-color: var(--red-bright); }
        .task-card.BAIXA { border-left-color: var(--green-main); }
        .task-card.is-done { opacity: 0.75; border-left-color: #6b7280; background: #f9fafb; }
        
        .task-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .tag { font-size: 0.65rem; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: #fef3c7; color: #92400e; text-transform: uppercase; }
        .task-desc { font-weight: 700; margin-bottom: 10px; font-size: 0.95rem; color: var(--text-dark); word-break: break-word; line-height: 1.4; }
        .task-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: #6b7280; font-weight: 600; }
        .task-actions { margin-top: 12px; display: flex; gap: 8px; }
        
        .task-img-preview {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #e5e7eb;
        }

        button.gold { background: var(--gold-gradient); border: none; padding: 9px 14px; border-radius: var(--radius-sm); font-weight: 800; cursor: pointer; flex: 1; color: #2e0608; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25); }
        button.danger { background: #fee2e2; color: var(--red-main); border: 1px solid #fca5a5; padding: 9px 14px; border-radius: var(--radius-sm); font-weight: 800; cursor: pointer; }

        .admin-bar { background: #fef3c7; padding: 12px 14px; margin: 0 14px 14px; border-radius: var(--radius-md); border: 2px dashed var(--yellow-main); display: flex; gap: 8px; flex-wrap: wrap; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; opacity: 0; transition: opacity 0.2s ease; }
        .modal.active { display: flex; opacity: 1; }
        .modal-body { background: #fff; width: 100%; max-width: 420px; border-radius: var(--radius-lg); padding: 22px; border: 2px solid var(--border); box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3); max-height: 90vh; overflow-y: auto; }
        .modal-body h3 { margin-bottom: 14px; font-size: 1.15rem; color: var(--card-dark); font-family: 'Outfit', sans-serif; font-weight: 800; }
        .modal-body label { font-size: 0.75rem; font-weight: 700; color: #4b5563; margin-bottom: 4px; display: block; text-transform: uppercase; }
        .modal-body input, .modal-body select, .modal-body textarea { width: 100%; padding: 10px; margin-bottom: 14px; border: 1.5px solid #d1d5db; border-radius: var(--radius-sm); font-size: 0.9rem; outline: none; }

        .toast-notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #1c1917;
            color: #fff;
            padding: 10px 20px;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1.5px solid var(--yellow-bright);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 200;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .toast-notification.show { transform: translateX(-50%) translateY(0); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="toast" class="toast-notification">Notificação</div>

<div class="app-container">
    <div class="header">
        <div class="logo">📊 DEMANDAS<span>EXPRESS</span></div>
        <span id="syncStatus" class="sync-badge sync-offline" onclick="fetchSupabaseData()">CONECTANDO...</span>
        <div class="user-selector">
            <select id="userSelect" onchange="switchUser(this.value)"></select>
        </div>
        <button class="btn-pin" onclick="openAdminAuthModal()">🔐 PIN</button>
    </div>

    <div class="hero-card" id="heroCard"></div>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-value" id="metricPending">0</div>
            <div class="metric-label">Pendentes</div>
        </div>
        <div class="metric-card gold">
            <div class="metric-value" id="metricDone">0</div>
            <div class="metric-label">Entregues</div>
        </div>
        <div class="metric-card">
            <div class="metric-value" id="metricStreak">0🔥</div>
            <div class="metric-label">Sequência</div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" id="tabTasksBtn" onclick="switchTab('tasks')">📋 Demandas</button>
        <button class="tab-btn" id="tabRankingBtn" onclick="switchTab('ranking')">🏆 Ranking XP</button>
    </div>

    <div id="adminPanel" class="admin-bar hidden">
        <button class="gold" onclick="openTaskModal()">+ Nova Demanda</button>
        <button class="gold" onclick="openUserModal()">+ Novo Membro</button>
        <button class="gold" onclick="openChangePinModal()">🔑 Mudar PIN</button>
        <button class="danger" onclick="logoutAdmin()">Sair ADM</button>
    </div>

    <div id="tabTasks">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Pesquisar demandas..." oninput="renderTasks()">
        </div>
        <div class="filter-chips" id="statusFilters">
            <div class="chip active" onclick="setFilter('ALL', this)">Todas</div>
            <div class="chip" onclick="setFilter('PENDENTE', this)">Pendentes</div>
            <div class="chip" onclick="setFilter('MINHAS', this)">Minhas Tarefas</div>
            <div class="chip" onclick="setFilter('CONCLUÍDO', this)">Concluídas</div>
        </div>
        <div class="tasks-container" id="tasksGrid"></div>
    </div>

    <div id="tabRanking" class="hidden" style="padding: 0 14px 20px;">
        <div id="rankList" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>
</div>

<!-- MODAL DE CRIAR DEMANDA (ADM) -->
<div class="modal" id="modalTask">
    <div class="modal-body">
        <h3>🚀 Criar Nova Demanda</h3>
        <label>Atribuir a:</label>
        <select id="taskAssignee"></select>
        <label>Descrição:</label>
        <textarea id="taskDesc" rows="3" placeholder="Descrição clara da demanda..."></textarea>
        <label>Prioridade:</label>
        <select id="taskPriority">
            <option value="BAIXA">🟢 Baixa (+60 XP)</option>
            <option value="NORMAL" selected>🟡 Normal (+100 XP)</option>
            <option value="ALTA">🟠 Alta (+150 XP)</option>
            <option value="URGENTE">🔴 Urgente (+250 XP)</option>
        </select>
        <label>Prazo Limite:</label>
        <input type="date" id="taskDeadline">
        <label>Anexar Foto de Instrução (Opcional):</label>
        <input type="file" id="taskAdminImage" accept="image/*">
        <button class="gold" onclick="saveTask()">Salvar Demanda</button>
        <button class="danger" style="width:100%; margin-top:6px;" onclick="closeModal('modalTask')">Cancelar</button>
    </div>
</div>

<!-- MODAL DE FINALIZAR DEMANDA (USUÁRIO) -->
<div class="modal" id="modalComplete">
    <div class="modal-body">
        <h3>✅ Finalizar Tarefa</h3>
        <input type="hidden" id="completeTaskId">
        <label>Observações / Devolutiva:</label>
        <textarea id="completeComment" rows="3" placeholder="Escreva o resultado da entrega..."></textarea>
        <label>Anexar Foto de Comprovação (Opcional):</label>
        <input type="file" id="taskUserImage" accept="image/*">
        <button class="gold" onclick="submitTaskCompletion()">Concluir e Resgatar XP!</button>
        <button class="danger" style="width:100%; margin-top:6px;" onclick="closeModal('modalComplete')">Cancelar</button>
    </div>
</div>

<!-- MODAL DE AUTENTICAÇÃO DO ADMIN -->
<div class="modal" id="modalAuth">
    <div class="modal-body">
        <h3>🔐 Autenticação de Gestor</h3>
        <label>PIN de Acesso (Padrão: 1234):</label>
        <input type="password" id="adminPinInput" placeholder="Digite seu PIN" maxlength="8">
        <button class="gold" onclick="verifyAdminPin()">Entrar no Painel</button>
        <button class="danger" style="width:100%; margin-top:6px;" onclick="closeModal('modalAuth')">Cancelar</button>
    </div>
</div>

<!-- MODAL DE NOVO USUÁRIO -->
<div class="modal" id="modalUser">
    <div class="modal-body">
        <h3>👤 Cadastrar Novo Membro</h3>
        <label>Nome do Colaborador:</label>
        <input type="text" id="newUserName" placeholder="Ex: Gabriel Silva">
        <label>Cargo / Função:</label>
        <input type="text" id="newUserRole" placeholder="Ex: Aprendiz, Operador, Supervisor">
        <button class="gold" onclick="saveUser()">Cadastrar Membro</button>
        <button class="danger" style="width:100%; margin-top:6px;" onclick="closeModal('modalUser')">Cancelar</button>
    </div>
</div>

<!-- MODAL DE ALTERAR PIN -->
<div class="modal" id="modalChangePin">
    <div class="modal-body">
        <h3>🔑 Alterar PIN do Gestor</h3>
        <label>PIN Atual:</label>
        <input type="password" id="pinCurrentInput" placeholder="PIN Atual">
        <label>Novo PIN:</label>
        <input type="password" id="pinNewInput" placeholder="Novo PIN">
        <button class="gold" onclick="changeAdminPin()">Atualizar PIN</button>
        <button class="danger" style="width:100%; margin-top:6px;" onclick="closeModal('modalChangePin')">Cancelar</button>
    </div>
</div>

<script>
    // Credenciais do Supabase
    const SUPABASE_URL = "https://qktpaeeinmkatwqbqtfs.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_vj6uL2ox55armNv-UDy_jA_v8B5bXUH"; 

    let supabase;
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    } catch(e) {
        console.error("Erro ao inicializar SDK Supabase:", e);
    }

    let state = {
        users: JSON.parse(localStorage.getItem('express_users')) || [
            { id: 'u1', name: 'ysah', role: 'MENOR APRENDIZ', xp: 0, streak: 0 },
            { id: 'u2', name: 'Ana Oliveira', role: 'Supervisora', xp: 450, streak: 3 }
        ],
        tasks: JSON.parse(localStorage.getItem('express_tasks')) || [],
        activeUserId: localStorage.getItem('express_active_user') || 'u1',
        isAdmin: false,
        adminPinHash: localStorage.getItem('express_admin_pin_hash') || "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4",
        currentFilter: 'ALL'
    };

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function hashString(str) {
        const encoder = new TextEncoder();
        const data = encoder.encode(str);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function convertFileToBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) resolve('');
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
        });
    }

    // Busca de dados no Supabase
    async function fetchSupabaseData() {
        updateSyncBadge('syncing', 'CONECTANDO...');
        if (!supabase) { updateSyncBadge('offline', 'OFFLINE'); return; }

        try {
            const { data: tasksData, error: tasksErr } = await supabase.from('tasks').select('*');
            if (tasksErr) throw tasksErr;

            if (tasksData) {
                state.tasks = tasksData;
                localStorage.setItem('express_tasks', JSON.stringify(state.tasks));
            }

            const { data: usersData } = await supabase.from('users').select('*');
            if (usersData && usersData.length > 0) {
                state.users = usersData;
                localStorage.setItem('express_users', JSON.stringify(state.users));
            }

            updateSyncBadge('online', 'ONLINE');
            renderApp();
        } catch (err) {
            console.error('Erro de conexão Supabase:', err);
            updateSyncBadge('online', 'ONLINE (LOCAL)');
            renderApp();
        }
    }

    async function syncTasksToSupabase() {
        updateSyncBadge('syncing', 'SALVANDO...');
        localStorage.setItem('express_tasks', JSON.stringify(state.tasks));
        if (!supabase) return;

        try {
            const { error } = await supabase.from('tasks').upsert(state.tasks, { onConflict: 'id' });
            if (error) throw error;
            updateSyncBadge('online', 'ONLINE');
        } catch (err) {
            console.error('Erro ao guardar tarefa:', err);
            updateSyncBadge('online', 'ONLINE (LOCAL)');
        }
    }

    async function syncUsersToSupabase() {
        localStorage.setItem('express_users', JSON.stringify(state.users));
        if (!supabase) return;
        try {
            await supabase.from('users').upsert(state.users, { onConflict: 'id' });
        } catch (err) { console.warn('Erro ao sincronizar usuários:', err); }
    }

    function updateSyncBadge(type, text) {
        const el = document.getElementById('syncStatus');
        if (!el) return;
        el.innerText = text;
        el.className = `sync-badge sync-${type}`;
    }

    function renderApp() {
        renderUserSelect();
        renderHeroCard();
        renderMetrics();
        renderTasks();
        renderRanking();
    }

    function getActiveUser() {
        return state.users.find(u => u.id === state.activeUserId) || state.users[0];
    }

    function renderUserSelect() {
        const select = document.getElementById('userSelect');
        if (select) {
            select.innerHTML = state.users.map(u => 
                `<option value="${u.id}" ${u.id === state.activeUserId ? 'selected' : ''}>${u.name}</option>`
            ).join('');
        }
    }

    function switchUser(id) {
        state.activeUserId = id;
        localStorage.setItem('express_active_user', id);
        renderHeroCard();
        renderTasks();
        showToast(`Perfil alterado para ${getActiveUser().name}`);
    }

    function renderHeroCard() {
        const u = getActiveUser();
        const lvl = Math.floor((u.xp || 0) / 300) + 1;
        const progress = Math.min(Math.round(((u.xp % 300) / 300) * 100), 100);

        const hero = document.getElementById('heroCard');
        if (hero) {
            hero.innerHTML = `
                <div class="user-profile-header">
                    <div class="avatar-frame">
                        <div class="avatar-inner">${u.name ? u.name.charAt(0).toLowerCase() : 'u'}</div>
                        <div class="level-badge-floating">NÍV ${lvl}</div>
                    </div>
                    <div>
                        <div style="font-weight:800; font-size:1.2rem; color:#fff;">${u.name}</div>
                        <div style="font-size:0.75rem; color:var(--yellow-bright); text-transform:uppercase; font-weight:700;">${u.role || 'Membro'}</div>
                    </div>
                </div>
                <div class="xp-container">
                    <div class="xp-bar-bg"><div class="xp-bar-fill" style="width:${progress}%"></div></div>
                    <div class="xp-stats"><span>${u.xp || 0} XP Total</span><span>Nível ${lvl} (${progress}%)</span></div>
                </div>
            `;
        }
    }

    function renderMetrics() {
        document.getElementById('metricPending').innerText = state.tasks.filter(t => t.status === 'PENDENTE').length;
        document.getElementById('metricDone').innerText = state.tasks.filter(t => t.status === 'CONCLUÍDO').length;
        document.getElementById('metricStreak').innerText = `${getActiveUser().streak || 0}🔥`;
    }

    function renderTasks() {
        const container = document.getElementById('tasksGrid');
        const query = (document.getElementById('searchInput')?.value || '').toLowerCase();

        let list = state.tasks.filter(t => {
            const matchesFilter = (
                state.currentFilter === 'ALL' ||
                (state.currentFilter === 'PENDENTE' && t.status === 'PENDENTE') ||
                (state.currentFilter === 'MINHAS' && t.assigneeId === state.activeUserId) ||
                (state.currentFilter === 'CONCLUÍDO' && t.status === 'CONCLUÍDO')
            );
            const matchesSearch = t.desc ? t.desc.toLowerCase().includes(query) : true;
            return matchesFilter && matchesSearch;
        });

        if (list.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:2rem; background:#fff; border-radius:12px; font-weight:600; color:#6b7280; border: 1px solid var(--border);">Nenhuma demanda encontrada.</div>`;
            return;
        }

        container.innerHTML = list.map(t => {
            const assignee = state.users.find(u => u.id === t.assigneeId) || { name: 'Desconhecido' };
            const isDone = t.status === 'CONCLUÍDO';
            const canComplete = t.assigneeId === state.activeUserId && !isDone;

            return `
                <div class="task-card ${t.priority} ${isDone ? 'is-done' : ''}">
                    <div class="task-top">
                        <span class="tag">${t.priority}</span>
                        <span style="font-weight:800; color:#b45309;">+${t.xp} XP</span>
                    </div>
                    <div class="task-desc">${t.desc}</div>
                    ${t.admin_img ? `<img src="${t.admin_img}" class="task-img-preview" alt="Foto da instrução">` : ''}
                    <div class="task-meta" style="margin-top:8px;">
                        <span>👤 ${assignee.name}</span>
                        <span>⏰ ${t.deadline ? new Date(t.deadline).toLocaleDateString('pt-BR') : 'Sem prazo'}</span>
                    </div>
                    ${t.devolutiva ? `<div style="background:#fff8f0; padding:8px; font-size:0.75rem; border-left:3px solid var(--yellow-main); margin-top:8px; border-radius:4px; color:#4b5563;">💬 <b>Devolutiva:</b> ${t.devolutiva}</div>` : ''}
                    ${t.user_img ? `<img src="${t.user_img}" class="task-img-preview" alt="Foto da comprovação">` : ''}
                    <div class="task-actions">
                        ${canComplete ? `<button onclick="openCompleteModal('${t.id}')" class="gold">✅ Finalizar Tarefa</button>` : ''}
                        ${state.isAdmin ? `<button onclick="deleteTask('${t.id}')" class="danger">🗑 Apagar</button>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderRanking() {
        const sorted = [...state.users].sort((a, b) => (b.xp || 0) - (a.xp || 0));
        document.getElementById('rankList').innerHTML = sorted.map((u, i) => {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i+1}`;
            return `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1rem; background:#fff; border-radius:10px; border:1px solid var(--border); box-shadow: var(--shadow-card);">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-size:1.1rem; font-weight:800;">${medal}</span>
                        <div>
                            <b style="font-size:0.95rem; color:var(--text-dark);">${u.name}</b> 
                            <div style="font-size:0.7rem; color:#6b7280; font-weight:600;">${u.role || 'Membro'}</div>
                        </div>
                    </div>
                    <div style="font-weight:900; color:#b45309; font-size:1rem; font-family:'Outfit', sans-serif;">${u.xp || 0} XP</div>
                </div>
            `;
        }).join('');
    }

    function openTaskModal() {
        document.getElementById('taskAssignee').innerHTML = state.users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
        document.getElementById('taskDesc').value = '';
        document.getElementById('taskDeadline').value = '';
        document.getElementById('taskAdminImage').value = '';
        openModal('modalTask');
    }

    async function saveTask() {
        const assigneeId = document.getElementById('taskAssignee').value;
        const desc = document.getElementById('taskDesc').value.trim();
        const priority = document.getElementById('taskPriority').value;
        const deadline = document.getElementById('taskDeadline').value;
        const fileInput = document.getElementById('taskAdminImage');

        if (!desc || !deadline) return alert('Por favor, defina a descrição e o prazo limite.');

        const xpMap = { BAIXA: 60, NORMAL: 100, ALTA: 150, URGENTE: 250 };
        
        let adminImgBase64 = '';
        if (fileInput.files && fileInput.files[0]) {
            adminImgBase64 = await convertFileToBase64(fileInput.files[0]);
        }

        const newTask = {
            id: 't_' + Date.now(),
            assigneeId: assigneeId,
            desc: desc,
            priority: priority,
            xp: xpMap[priority],
            deadline: deadline,
            status: 'PENDENTE',
            devolutiva: '',
            admin_img: adminImgBase64,
            user_img: ''
        };

        state.tasks.unshift(newTask);

        closeModal('modalTask');
        renderApp();
        syncTasksToSupabase();
        showToast('Nova demanda enviada!');
    }

    function openCompleteModal(id) {
        document.getElementById('completeTaskId').value = id;
        document.getElementById('completeComment').value = '';
        document.getElementById('taskUserImage').value = '';
        openModal('modalComplete');
    }

    async function submitTaskCompletion() {
        const id = document.getElementById('completeTaskId').value;
        const comment = document.getElementById('completeComment').value.trim();
        const fileInput = document.getElementById('taskUserImage');
        
        const task = state.tasks.find(t => t.id === id);
        const user = state.users.find(u => u.id === task.assigneeId);

        let userImgBase64 = '';
        if (fileInput.files && fileInput.files[0]) {
            userImgBase64 = await convertFileToBase64(fileInput.files[0]);
        }

        task.status = 'CONCLUÍDO';
        task.devolutiva = comment;
        task.user_img = userImgBase64;

        if (user) {
            user.xp = (user.xp || 0) + Number(task.xp);
            user.streak = (user.streak || 0) + 1;
        }

        closeModal('modalComplete');
        renderApp();
        syncTasksToSupabase();
        syncUsersToSupabase();
        showToast(`Demanda concluída! +${task.xp} XP acumulados!`);
    }

    async function deleteTask(id) {
        if (!confirm('Tem certeza que deseja apagar esta demanda?')) return;
        state.tasks = state.tasks.filter(t => t.id !== id);
        
        if (supabase) {
            try { await supabase.from('tasks').delete().eq('id', id); } catch (e) {}
        }

        renderApp();
        syncTasksToSupabase();
        showToast('Demanda removida.');
    }

    function openUserModal() { 
        document.getElementById('newUserName').value = '';
        document.getElementById('newUserRole').value = '';
        openModal('modalUser'); 
    }

    function saveUser() {
        const name = document.getElementById('newUserName').value.trim();
        const role = document.getElementById('newUserRole').value.trim();
        if (!name) return alert('Informe o nome do membro.');

        state.users.push({ id: 'u_' + Date.now(), name, role: role || 'Membro', xp: 0, streak: 0 });
        closeModal('modalUser');
        renderApp();
        syncUsersToSupabase();
        showToast(`Membro ${name} cadastrado!`);
    }

    async function verifyAdminPin() {
        const pin = document.getElementById('adminPinInput').value;
        const h = await hashString(pin);
        if (h === state.adminPinHash) {
            state.isAdmin = true;
            closeModal('modalAuth');
            document.getElementById('adminPanel').classList.remove('hidden');
            renderTasks();
            showToast('Painel Gestor desbloqueado');
        } else {
            alert('PIN Incorreto');
        }
    }

    function logoutAdmin() {
        state.isAdmin = false;
        document.getElementById('adminPanel').classList.add('hidden');
        renderTasks();
        showToast('Sessão de Gestor encerrada');
    }

    function openAdminAuthModal() { 
        document.getElementById('adminPinInput').value = '';
        openModal('modalAuth'); 
    }

    function openChangePinModal() { 
        document.getElementById('pinCurrentInput').value = '';
        document.getElementById('pinNewInput').value = '';
        openModal('modalChangePin'); 
    }

    async function changeAdminPin() {
        const cur = document.getElementById('pinCurrentInput').value;
        const newP = document.getElementById('pinNewInput').value;
        if ((await hashString(cur)) !== state.adminPinHash) return alert('PIN atual incorreto.');
        if (!newP || newP.length < 4) return alert('O novo PIN deve ter pelo menos 4 dígitos.');

        state.adminPinHash = await hashString(newP);
        localStorage.setItem('express_admin_pin_hash', state.adminPinHash);
        closeModal('modalChangePin');
        showToast('PIN de Gestor atualizado!');
    }

    function switchTab(t) {
        document.querySelectorAll('.nav-tabs .tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}Btn`).classList.add('active');
        document.getElementById('tabTasks').classList.toggle('hidden', t !== 'tasks');
        document.getElementById('tabRanking').classList.toggle('hidden', t !== 'ranking');
    }

    function setFilter(f, el) {
        state.currentFilter = f;
        document.querySelectorAll('#statusFilters .chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        renderTasks();
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    setInterval(fetchSupabaseData, 8000);

    window.onload = () => {
        renderApp();
        fetchSupabaseData();
    };
</script>

</body>
</html>

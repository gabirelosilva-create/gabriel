<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#9f1d20">
    <title>Demandas Express</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap');
        :root {
            --primary: #b3262b;
            --primary-hover: #8f171c;
            --ink: #451416;
            --bg: #fff8e7;
            --surface: #fffdf7;
            --text: #3f2521;
            --text-muted: #80645d;
            --border: #ead5b0;
            --success: #9f1d20;
            --warning: #bd5d16;
            --danger: #a9161d;
            --yellow: #f3bd32;
            --yellow-soft: #fff0b8;
            --radius: 18px;
            --shadow: 0 18px 42px rgba(118, 31, 25, .11);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "DM Sans"; }
        body {
            background: radial-gradient(circle at 15% 0%, #a3262b 0, transparent 40rem), radial-gradient(circle at 90% 100%, #5e0f13 0, transparent 35rem), #80171b;
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background: rgba(255,248,231,.94);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
            width: 100%;
            max-width: 520px;
        }
        .logo {
            font-family: "Manrope", sans-serif;
            font-size: 1rem;
            font-weight: 800;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: .65rem;
        }
        .brand-mark { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); background: var(--yellow); border-radius: 12px 12px 12px 3px; }
        .user-controls { display: flex; gap: 0.5rem; align-items: center; }
        select, button, input, textarea {
            font-size: 0.9rem;
            padding: 0.6rem 0.8rem;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            outline: none;
            transition: all 0.2s ease;
        }
        button {
            background-color: var(--primary);
            color: #fffdf7;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            min-height: 44px;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-1px); }
        button.secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        button.secondary:hover { color: var(--ink); background: var(--yellow-soft); }
        main {
            flex: 1;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1rem 3rem;
            background: var(--bg);
        }
        .intro { padding: 2rem 0 1rem; }
        .eyebrow { color: var(--primary); font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; margin-bottom: .75rem; }
        .intro h1 { font-family: "Manrope",sans-serif; font-size: 2.5rem; color: var(--ink); }
        .intro-copy { color: var(--text-muted); line-height: 1.6; margin-top: 0.5rem; }
        .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin: 2rem 0 1rem; }
        .section-heading h2 { font-family: "Manrope",sans-serif; font-size: 1.35rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .65rem; margin-bottom: 1.25rem; }
        .stat-card {
            background: var(--surface);
            padding: 1.2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(118,31,25,.06);
        }
        .stat-card.hero { grid-column: 1 / -1; background: linear-gradient(135deg, #b3262b 0%, #8f171c 100%); color: white; }
        .stat-card .num { font-family: "Manrope", sans-serif; font-size: 2rem; font-weight: 800; }
        .stat-card .label { font-size: .72rem; text-transform: uppercase; margin-top: 0.5rem; }
        .admin-panel {
            background: var(--primary);
            color: var(--surface);
            border-radius: var(--radius);
            padding: 1rem;
            margin: 1.5rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .admin-panel strong { color: var(--yellow); }
        .admin-panel button { background: var(--yellow); color: var(--ink); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; }
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: .65rem;
            border-top: 4px solid var(--yellow);
        }
        .card.is-done { border-top-color: #2f7a3b; }
        .card strong { display: block; margin: 0.5rem; }
        .card .meta { font-size: .8rem; color: var(--text-muted); margin: 0.5rem; }
        .card .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 99px; margin: 0.5rem; }
        .badge-pending { background: var(--yellow-soft); color: #7c430b; }
        .badge-done { background: #f4d7d4; color: var(--success); }
        .card-actions { display: flex; gap: 0.4rem; margin: 0.5rem; flex-wrap: wrap; }
        .card-actions button { flex: 1 1 100px; font-size: 0.8rem; padding: 0.4rem; }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(69,20,22,.82);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .modal.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background: var(--surface);
            border-radius: var(--radius);
            width: 90%;
            max-width: 480px;
            padding: 1.75rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .modal-content h3 { font-family: "Manrope"; font-size: 1.45rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
        .hidden { display: none !important; }
        .filters { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .filters button { background: var(--surface); border: 1px solid var(--border); cursor: pointer; }
        .filters button.on { background: var(--ink); color: var(--yellow); border-color: var(--ink); }
        .ranking { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; }
        .rank-row { display: grid; grid-template-columns: 30px 1fr auto; gap: .6rem; padding: .6rem; border-radius: 8px; align-items: center; }
        .rank-row:hover { background: var(--yellow-soft); }
        .rank-pos { font-family: "Manrope"; font-weight: 800; text-align: center; }
        .rank-name strong { display: block; font-size: .88rem; }
        .rank-xp { font-family: "Manrope"; font-weight: 800; text-align: right; }
        .empty-state { text-align: center; padding: 2rem; border: 1px dashed #d49b34; border-radius: var(--radius); background: rgba(255,240,184,.42); }
    </style>
</head>
<body>
    <header>
        <div class="logo"><span class="brand-mark">⚡</span><span>Demandas</span></div>
        <div class="user-controls">
            <button id="adminBtn" onclick="openModal('modalAuth')" class="secondary">ADM</button>
        </div>
    </header>

    <main>
        <section class="intro">
            <p class="eyebrow">Central de operações</p>
            <h1>Trabalho claro.<br>Entrega visível.</h1>
            <p class="intro-copy">Acompanhe o que precisa ser feito e mantenha a equipe alinhada.</p>
        </section>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="num" id="statPending">0</div>
                <div class="label">Pendentes</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statDone">0</div>
                <div class="label">Entregues</div>
            </div>
        </div>

        <div id="adminPanel" class="admin-panel hidden">
            <strong>Painel ADM</strong>
            <div style="width: 100%; display: flex; gap: 0.4rem; flex-wrap: wrap;">
                <button onclick="openModal('modalUser')">+ Equipe</button>
                <button onclick="openModal('modalTask')">+ Demanda</button>
                <button onclick="logoutAdmin()" class="secondary">Sair</button>
            </div>
        </div>

        <div class="section-heading"><h2>Demandas</h2></div>
        <div class="filters">
            <button class="on" onclick="setFilter('ALL')">Todas</button>
            <button onclick="setFilter('PENDENTE')">Pendentes</button>
            <button onclick="setFilter('CONCLUÍDO')">Entregues</button>
        </div>
        <div id="tasksGrid" class="grid"></div>

        <div class="section-heading"><h2>Ranking</h2></div>
        <div class="ranking">
            <div id="rankList"></div>
        </div>
    </main>

    <div id="modalAuth" class="modal">
        <div class="modal-content">
            <h3>Acesso ADM</h3>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="adminPasswordInput" placeholder="Digite a senha">
            </div>
            <button onclick="authenticateAdmin()">Entrar</button>
            <button onclick="closeModal('modalAuth')" class="secondary">Cancelar</button>
        </div>
    </div>

    <div id="modalUser" class="modal">
        <div class="modal-content">
            <h3>Novo Membro</h3>
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="newUserName" placeholder="Ex: Gabriel">
            </div>
            <button onclick="addUser()">Salvar</button>
            <button onclick="closeModal('modalUser')" class="secondary">Cancelar</button>
        </div>
    </div>

    <div id="modalTask" class="modal">
        <div class="modal-content">
            <h3>Nova Demanda</h3>
            <div class="form-group">
                <label>Responsável</label>
                <select id="taskAssignedTo"></select>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea id="taskDescription" rows="3" placeholder="Detalhes..."></textarea>
            </div>
            <div class="form-group">
                <label>Prioridade</label>
                <select id="taskPriority">
                    <option value="BAIXA">Baixa</option>
                    <option value="NORMAL" selected>Normal</option>
                    <option value="ALTA">Alta</option>
                    <option value="URGENTE">Urgente</option>
                </select>
            </div>
            <button onclick="createTask()">Enviar</button>
            <button onclick="closeModal('modalTask')" class="secondary">Cancelar</button>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "1234";
        let isAdmin = false;
        let statusFilter = 'ALL';
        let users = [];
        let tasks = [];
        let deliveries = [];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Sistema de dados local
        const DataStore = {
            loadData() {
                const stored = localStorage.getItem('demandas-data');
                if (stored) {
                    try {
                        return JSON.parse(stored);
                    } catch (e) {
                        console.error('Erro ao carregar:', e);
                    }
                }
                return {
                    users: [
                        { id: '1', name: 'Gabriel', active: true },
                        { id: '2', name: 'Maria', active: true }
                    ],
                    tasks: [],
                    deliveries: []
                };
            },
            save(data) {
                localStorage.setItem('demandas-data', JSON.stringify(data));
            },
            addUser(data, name) {
                const id = Date.now().toString();
                data.users.push({ id, name, active: true });
                this.save(data);
            },
            addTask(data, assignedTo, description, priority) {
                const id = Date.now().toString();
                data.tasks.push({
                    id,
                    assignedTo,
                    description,
                    priority,
                    status: 'PENDENTE',
                    createdAt: new Date().toISOString()
                });
                this.save(data);
            },
            deliverTask(data, taskId) {
                const task = data.tasks.find(t => t.id === taskId);
                if (task) {
                    const xpTable = { BAIXA: 60, NORMAL: 100, ALTA: 140, URGENTE: 200 };
                    let xp = xpTable[task.priority] || 100;
                    data.deliveries.push({
                        taskId,
                        userId: task.assignedTo,
                        description: task.description,
                        priority: task.priority,
                        deliveredAt: new Date().toISOString(),
                        xp
                    });
                    data.tasks = data.tasks.filter(t => t.id !== taskId);
                    this.save(data);
                }
            }
        };

        async function loadData() {
            const data = DataStore.loadData();
            users = data.users || [];
            tasks = data.tasks || [];
            deliveries = data.deliveries || [];
            render();
        }

        function authenticateAdmin() {
            const pin = document.getElementById('adminPasswordInput').value;
            if (pin === ADMIN_PIN) {
                isAdmin = true;
                document.getElementById('adminPanel').classList.remove('hidden');
                document.getElementById('adminBtn').classList.add('hidden');
                closeModal('modalAuth');
                render();
            } else {
                alert('PIN Incorreto!');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminBtn').classList.remove('hidden');
            render();
        }

        function addUser() {
            const name = document.getElementById('newUserName').value.trim();
            if (!name) return alert('Informe o nome');
            const data = DataStore.loadData();
            DataStore.addUser(data, name);
            document.getElementById('newUserName').value = '';
            closeModal('modalUser');
            loadData();
        }

        function createTask() {
            const assignedTo = document.getElementById('taskAssignedTo').value;
            const description = document.getElementById('taskDescription').value;
            const priority = document.getElementById('taskPriority').value;
            if (!assignedTo || !description.trim()) return alert('Preencha os campos');
            const data = DataStore.loadData();
            DataStore.addTask(data, assignedTo, description, priority);
            closeModal('modalTask');
            document.getElementById('taskDescription').value = '';
            loadData();
        }

        function deliverTask(taskId) {
            const data = DataStore.loadData();
            DataStore.deliverTask(data, taskId);
            loadData();
        }

        function setFilter(val) {
            statusFilter = val;
            document.querySelectorAll('.filters button').forEach(b => {
                b.classList.remove('on');
            });
            event.target.classList.add('on');
            render();
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
            if (id === 'modalTask') {
                const select = document.getElementById('taskAssignedTo');
                select.innerHTML = users.map(u => `<option value="${u.id}">${escapeHtml(u.name)}</option>`).join('');
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function render() {
            const filtered = statusFilter === 'ALL' ? tasks : tasks.filter(t => t.status === statusFilter);
            const tasksHtml = filtered.length ? filtered.map(task => {
                const user = users.find(u => u.id === task.assignedTo);
                return `
                    <div class="card ${task.status === 'CONCLUÍDO' ? 'is-done' : ''}">
                        <strong>${escapeHtml(task.description.substring(0, 50))}</strong>
                        <div class="meta">${user ? escapeHtml(user.name) : 'Sem responsável'}</div>
                        <span class="badge ${task.status === 'PENDENTE' ? 'badge-pending' : 'badge-done'}">${task.status}</span>
                        ${task.status === 'PENDENTE' ? `<div class="card-actions"><button onclick="deliverTask('${task.id}')" style="background: #2f7a3b;">✓ Entregar</button></div>` : ''}
                    </div>
                `;
            }).join('') : '<div class="empty-state">Nenhuma demanda</div>';

            document.getElementById('tasksGrid').innerHTML = tasksHtml;

            const userXp = {};
            deliveries.forEach(d => {
                userXp[d.userId] = (userXp[d.userId] || 0) + d.xp;
            });

            const ranking = users.map(u => ({
                name: u.name,
                xp: userXp[u.id] || 0
            })).sort((a, b) => b.xp - a.xp);

            document.getElementById('rankList').innerHTML = ranking.length ? ranking.map((r, i) => `
                <div class="rank-row">
                    <div class="rank-pos">${i + 1}º</div>
                    <div class="rank-name"><strong>${escapeHtml(r.name)}</strong></div>
                    <div class="rank-xp">${r.xp} XP</div>
                </div>
            `).join('') : '<div class="empty-state">Sem dados</div>';

            document.getElementById('statPending').textContent = tasks.filter(t => t.status === 'PENDENTE').length;
            document.getElementById('statDone').textContent = deliveries.length;
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>

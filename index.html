<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a0c0e">
<title>Demandas Express</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
:root{--bg:radial-gradient(circle at 50% 0%,#7a1518 0%,#3d080a 60%,#1f0304 100%);--dark:#2e0608;--gold:#f59e0b;--gold2:#fbbf24;--gradient:linear-gradient(135deg,#f59e0b,#fef08a 50%,#d97706);--red:#b91c1c;--red2:#ef4444;--green:#10b981;--border:#fcd34d;--text:#1c1917;--muted:#78353a;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{background:var(--bg) fixed;color:var(--text);min-height:100%;display:flex;justify-content:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.app{width:100%;max-width:620px;background:#fffefa;border-radius:20px;overflow:hidden;border:2px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.4);align-self:flex-start}
.header{background:var(--dark);padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:50}
.logo{font-family:Outfit;font-weight:900;font-size:1.1rem;color:#fff;margin-right:auto}.logo span{color:var(--gold2)}
.badge{font-size:.68rem;font-weight:800;padding:5px 10px;border-radius:99px;color:#fff;border:0;cursor:pointer}
.on{background:var(--green)}.off{background:var(--red2)}.sync{background:var(--gold);color:#000}
select,input,textarea{font-size:.9rem}
.header select{background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px;font-weight:700;max-width:130px}
.btn{background:var(--gradient);border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer;color:var(--dark);flex:1}
.btn:active{transform:scale(.97)}.btn.sm{flex:none;padding:6px 12px}
.btn.danger{background:#fee2e2;color:var(--red);border:1px solid #fca5a5;flex:none}
.btn.ghost{background:#fef3c7;color:#78350f}
.hero{background:linear-gradient(135deg,#3d080a,#1f0304);margin:14px;padding:16px;border-radius:var(--r);border:2px solid var(--border);color:#fff}
.who{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;background:var(--gradient);border-radius:16px;display:grid;place-items:center;font:900 1.7rem Outfit;color:var(--dark);position:relative;flex-shrink:0}
.lvl{position:absolute;bottom:-8px;background:var(--red);color:#fff;font-size:.6rem;padding:2px 7px;border-radius:10px;font-weight:800;border:1.5px solid var(--gold2)}
.xpbg{background:rgba(255,255,255,.12);height:10px;border-radius:99px;overflow:hidden;margin-top:14px}
.xpfill{background:var(--gradient);height:100%;width:0;transition:width .6s}
.xps{display:flex;justify-content:space-between;font-size:.75rem;margin-top:6px;color:#fde68a;font-weight:600}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px}
.metric{background:#fff;border:1.5px solid var(--border);border-bottom:3px solid var(--red);border-radius:var(--r);padding:8px 4px;text-align:center}
.metric b{display:block;font:900 1.3rem Outfit;color:var(--dark)}.metric small{font-size:.6rem;font-weight:800;color:var(--muted);text-transform:uppercase}
.tabs{display:flex;gap:8px;padding:14px}
.tab{flex:1;padding:10px;border:0;border-radius:var(--r);font-weight:800;background:#fef3c7;color:#78350f;cursor:pointer}
.tab[aria-selected=true]{background:var(--red);color:#fff}
.admin{background:#fef3c7;padding:12px;margin:0 14px 14px;border-radius:var(--r);border:2px dashed var(--gold);display:flex;gap:8px;flex-wrap:wrap}
.pad{padding:0 14px 10px}
.pad input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--r)}
.chips{display:flex;gap:6px;padding:0 14px 14px;overflow-x:auto}
.chip{padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:.78rem;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--red);color:#fff;border-color:var(--red)}
.list{padding:0 14px 20px;display:flex;flex-direction:column;gap:10px}
.task{background:#fff;border-radius:var(--r);padding:14px;border:1px solid var(--border);border-left:6px solid var(--gold);box-shadow:0 4px 15px rgba(0,0,0,.06)}
.task.URGENTE{border-left-color:var(--red2)}.task.BAIXA{border-left-color:var(--green)}
.task.done{opacity:.75;border-left-color:#6b7280;background:#f9fafb}
.top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tag{font-size:.65rem;font-weight:800;padding:3px 8px;border-radius:6px;background:#fef3c7;color:#92400e}
.tag.late{background:#fee2e2;color:var(--red)}.tag.ok{background:#d1fae5;color:#065f46}
.desc{font-weight:700;margin-bottom:10px;word-break:break-word;line-height:1.4;white-space:pre-wrap}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:#6b7280;font-weight:600;flex-wrap:wrap}
.fb{margin-top:8px;padding:8px;background:#f3f4f6;border-radius:8px;font-size:.8rem;white-space:pre-wrap}
.acts{margin-top:12px;display:flex;gap:8px}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:8px;border:1px solid #e5e7eb;cursor:zoom-in}
.rank{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px}
.rank.me{border:2px solid var(--red);background:#fff7ed}
.pos{font:900 1.2rem Outfit;width:34px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.active{display:flex}
.mbody{background:#fff;width:100%;max-width:420px;border-radius:20px;padding:22px;border:2px solid var(--border);max-height:90vh;overflow-y:auto}
.mbody h3{margin-bottom:14px;font:800 1.15rem Outfit;color:var(--dark)}
.mbody label{font-size:.75rem;font-weight:700;color:#4b5563;margin-bottom:4px;display:block}
.mbody input,.mbody select,.mbody textarea{width:100%;padding:10px;margin-bottom:14px;border:1.5px solid #d1d5db;border-radius:8px}
.mbody .btn{width:100%}.mbody .btn.danger{margin-top:6px;width:100%}
.err{color:var(--red);font-size:.8rem;font-weight:700;margin:-8px 0 12px;min-height:1em}
#toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-120px);background:#1c1917;color:#fff;padding:10px 20px;border-radius:99px;font-weight:700;font-size:.85rem;border:1.5px solid var(--gold2);z-index:200;transition:transform .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== REFINO VISUAL ===== */
:root{--paper:#fffaf0;--ink:#2a0d0f;--shadow:0 1px 2px rgba(60,10,10,.08),0 8px 24px -8px rgba(60,10,10,.18)}
body{background:var(--bg) fixed;font-feature-settings:"tnum"}
.app{background:var(--paper);border:0;border-radius:28px;box-shadow:0 0 0 1.5px rgba(252,211,77,.55),0 30px 60px -20px rgba(0,0,0,.65)}
.header{background:rgba(46,6,8,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(252,211,77,.45);padding:12px 16px}
.logo{font-size:1.2rem;letter-spacing:-.03em}
.badge{padding:6px 12px;font-weight:700;letter-spacing:.01em;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.9}
.badge.sync::before{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.header select{border-radius:10px;padding:7px 8px;box-shadow:inset 0 0 0 1px var(--border);border:0}
.btn{border-radius:12px;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 4px 10px -4px rgba(217,119,6,.6);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{box-shadow:none;background:#fdeec3}
.btn.danger{box-shadow:none}
.hero{margin:16px;padding:18px;border:0;border-radius:22px;background:
 radial-gradient(120% 90% at 100% 0%,rgba(251,191,36,.22),transparent 55%),
 linear-gradient(145deg,#4a0c0e,#1f0304);box-shadow:0 0 0 1.5px rgba(252,211,77,.55),var(--shadow)}
.avatar{border-radius:18px;width:60px;height:60px;box-shadow:0 6px 16px -4px rgba(251,191,36,.6),inset 0 -3px 0 rgba(0,0,0,.12)}
.lvl{letter-spacing:.02em;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.xpbg{height:12px;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.xpfill{position:relative;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.xpfill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 2.6s 1.2s infinite}
@keyframes grow{from{width:0}}
@keyframes shine{to{transform:translateX(100%)}}
.metrics{gap:10px;padding:0 16px}
.metric{border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:12px 4px;position:relative}
.metric::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--red)}
.metric:nth-child(2)::after{background:var(--green)}.metric:nth-child(3)::after{background:var(--red2)}.metric:nth-child(4)::after{background:var(--gold)}
.metric b{font-size:1.45rem;color:var(--ink)}
.metric small{font-size:.62rem;letter-spacing:.02em;text-transform:none;font-weight:700}
.tabs{padding:18px 16px 14px}
.tabs{background:none}
.tab{border-radius:14px;padding:12px;background:#fbecc4;transition:all .2s}
.tab[aria-selected=true]{background:linear-gradient(160deg,#c42222,#8f1313);box-shadow:0 8px 18px -8px rgba(185,28,28,.8)}
.admin{border-radius:18px;background:repeating-linear-gradient(135deg,#fef3c7 0 12px,#fdeab0 12px 24px);margin:0 16px 16px}
.pad{padding:0 16px 12px}
.pad input{border-radius:14px;padding:12px 14px;border:0;background:#fff;box-shadow:var(--shadow)}
.chips{padding:0 16px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:0;box-shadow:var(--shadow);padding:8px 16px;background:#fff}
.chip[aria-pressed=true]{box-shadow:0 6px 14px -6px rgba(185,28,28,.8)}
.list{padding:0 16px 24px;gap:12px}
.task{border:0;border-left:0;border-radius:18px;padding:16px 16px 16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold)}
.task.URGENTE::before{background:var(--red2)}.task.BAIXA::before{background:var(--green)}.task.ALTA::before{background:#f97316}.task.done::before{background:#9ca3af}
.task.done{opacity:.7;filter:saturate(.6)}
.tag{padding:4px 10px;border-radius:99px;font-size:.68rem}
.task.URGENTE .tag:first-child{background:#fee2e2;color:var(--red)}
.task.BAIXA .tag:first-child{background:#d1fae5;color:#065f46}
.desc{font-size:1rem;color:var(--ink)}
.meta{padding-top:8px;border-top:1px dashed #f3dca0}
.thumb{border-radius:12px;border:0;box-shadow:var(--shadow)}
.fb{background:#fff7e0;border-left:3px solid var(--gold);border-radius:4px 10px 10px 4px}
.rank{border:0;border-radius:18px;box-shadow:var(--shadow);padding:14px}
.rank:nth-child(1){background:linear-gradient(135deg,#fff3c4,#fff);box-shadow:0 0 0 1.5px var(--gold2),var(--shadow)}
.rank.me{box-shadow:0 0 0 2px var(--red),var(--shadow)}
.pos{font-size:1.4rem}
.empty{border:2px dashed #f3dca0;border-radius:18px;margin:0 2px}
.modal{align-items:flex-end;padding:0;background:rgba(20,2,3,.7)}
.mbody{max-width:560px;border:0;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
.mbody::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:#e5d9b8;margin:-10px auto 16px}
.mbody input,.mbody select,.mbody textarea{border:1.5px solid #ecdcae;border-radius:12px;background:#fffdf6}
.mbody input:focus,.mbody select:focus,.mbody textarea:focus{border-color:var(--gold);outline:0;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
#toast{background:rgba(28,25,23,.95);backdrop-filter:blur(8px);box-shadow:0 12px 30px -8px rgba(0,0,0,.6)}
@media(min-width:640px){.modal{align-items:center;padding:16px}.mbody{border-radius:24px}.mbody::before{display:none}}
@media(max-width:380px){.metric b{font-size:1.15rem}.logo{font-size:1rem}}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}.gal:empty{display:none}.gal .thumb{margin:0;height:130px;max-height:none}.mbody .gal{margin-top:-6px}

/* ===== GAMIFICAÇÃO + RANKING ===== */
.bd-head{display:flex;justify-content:space-between;margin-top:16px;font-size:.78rem;font-weight:700;color:#fde68a}
.bd{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.bdg{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;background:rgba(255,255,255,.07);border:1px solid rgba(252,211,77,.2);cursor:pointer;filter:grayscale(1);opacity:.45}
.bdg.on{filter:none;opacity:1;background:linear-gradient(145deg,rgba(251,191,36,.35),rgba(251,191,36,.08));border-color:var(--gold2);box-shadow:0 0 14px -2px rgba(251,191,36,.7)}
.rk-msg{background:linear-gradient(135deg,#4a0c0e,#2e0608);color:#fde68a;border-radius:16px;padding:12px 14px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow)}
.rk-msg b{color:#fff}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding:30px 0 6px;background:radial-gradient(70% 60% at 50% 0%,rgba(251,191,36,.25),transparent 70%)}
.pod{flex:1;max-width:170px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;animation:rise .7s cubic-bezier(.2,.9,.25,1) both}
.pod.g{order:0;flex:1.2;animation-delay:.25s}.pod.s{animation-delay:.1s}.pod.b{animation-delay:.4s}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
.crown{font-size:1.7rem;animation:bob 2s ease-in-out infinite;margin-bottom:-6px;filter:drop-shadow(0 4px 6px rgba(245,158,11,.6))}
@keyframes bob{50%{transform:translateY(-5px) rotate(4deg)}}
.pav{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:900 1.5rem Outfit;color:var(--dark);background:var(--gradient);position:relative;box-shadow:0 0 0 3px #fff,0 8px 18px -6px rgba(0,0,0,.5)}
.pod.g .pav{width:70px;height:70px;font-size:1.8rem;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--gold2),0 0 24px rgba(251,191,36,.8)}
.pod.s .pav{background:linear-gradient(135deg,#f3f4f6,#9ca3af)}.pod.b .pav{background:linear-gradient(135deg,#fdba74,#b45309);color:#fff}
.pav i{position:absolute;right:-8px;bottom:-6px;font-style:normal;font-size:1.3rem}
.pn{font-weight:800;margin-top:10px;font-size:.9rem;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.px{font:900 1.05rem Outfit;color:var(--red)}
.pt{font-size:.68rem;font-weight:700;color:var(--muted)}
.pb{font-size:.8rem;min-height:1.1em;margin:2px 0 6px;letter-spacing:1px}
.blk{width:100%;border-radius:14px 14px 0 0;display:grid;place-items:center;font:900 1.6rem Outfit;color:rgba(0,0,0,.35);position:relative;overflow:hidden}
.pod.g .blk{height:96px;background:linear-gradient(180deg,#fde68a,#f59e0b)}
.pod.s .blk{height:68px;background:linear-gradient(180deg,#f3f4f6,#9ca3af)}
.pod.b .blk{height:50px;background:linear-gradient(180deg,#fdba74,#b45309);color:rgba(255,255,255,.6)}
.pod.g .blk::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-120%);animation:shine 3s 1s infinite}
.pod.me .pn{color:var(--red)}.pod.me .blk{box-shadow:inset 0 0 0 3px var(--red)}
.pod .x{position:absolute;top:0;right:0;padding:2px 8px}
.rank .sub{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .pos{font-size:1.1rem;color:var(--muted)}
.rank.me{background:linear-gradient(135deg,#fff7ed,#fff)}
.xpfloat{position:fixed;left:50%;top:42%;transform:translateX(-50%);font:900 2.6rem Outfit;color:#fbbf24;text-shadow:0 3px 0 #92400e,0 8px 24px rgba(0,0,0,.5);z-index:320;pointer-events:none;animation:floatup 1.6s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:310}
.lvlup{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,2,3,.82);z-index:300;animation:fadein .3s}
.lvlup div{text-align:center;color:#fff;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.lvlup small{display:block;font-weight:700;color:#fde68a;margin-bottom:6px}
.lvlup b{display:block;font:900 3.6rem Outfit;background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.lvlup span{display:inline-block;margin-top:12px;padding:6px 18px;border-radius:99px;border:2px solid var(--gold2);color:var(--gold2);font-weight:800}
@keyframes fadein{from{opacity:0}}@keyframes pop{from{transform:scale(.4);opacity:0}}
@media(max-width:380px){.bd{gap:4px}.pn{font-size:.8rem}}
.tag.wait{background:#ede9fe;color:#5b21b6}
.task.val::before{background:#8b5cf6}
.fb.rej{background:#fee2e2;border-left-color:var(--red);margin-bottom:8px;margin-top:0}
.ph{position:relative}.ph .thumb{margin:0;height:130px;max-height:none}
.ph button{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-weight:800;cursor:pointer}
.acts{flex-wrap:wrap}
.errbar{background:#fee2e2;color:#991b1b;padding:10px 16px;font-size:.8rem;font-weight:700;border-bottom:1px solid #fca5a5}
</style>
</head>
<body>
<div id="toast" role="status" aria-live="polite"></div>
<main class="app">
 <header class="header">
  <div class="logo">📊 DEMANDAS<span>EXPRESS</span></div>
  <button id="sync" class="badge off" title="Toque para sincronizar">Offline</button>
  <select id="userSelect" aria-label="Membro ativo"></select>
  <button class="btn sm" id="pinBtn">🔐 Gestor</button>
 </header>
 <div id="errBar" class="errbar hidden" role="alert"></div>

 <section class="hero" id="hero" aria-label="Perfil"></section>
 <section class="metrics" aria-label="Resumo">
  <div class="metric"><b id="mPend">0</b><small>Pendentes</small></div>
  <div class="metric"><b id="mDone">0</b><small>Entregues</small></div>
  <div class="metric"><b id="mLate">0</b><small>Atrasadas</small></div>
  <div class="metric"><b id="mStreak">0🔥</b><small>Sequência</small></div>
 </section>

 <div class="tabs" role="tablist">
  <button class="tab" role="tab" id="tabT" aria-selected="true" data-tab="tasks">📋 Demandas</button>
  <button class="tab" role="tab" id="tabR" aria-selected="false" data-tab="rank">🏆 Ranking</button>
 </div>

 <div id="admin" class="admin hidden">
  <button class="btn" id="goVal">⏳ Validar <span id="valCount2"></span></button>
  <button class="btn" data-open="task">+ Demanda</button>
  <button class="btn" data-open="user">+ Membro</button>
  <button class="btn ghost" id="exportBtn">⬇ Backup</button>
  <label class="btn ghost" style="text-align:center;margin:0">⬆ Restaurar<input type="file" id="importFile" accept="application/json" hidden></label>
  <button class="btn ghost" data-open="pin">🔑 PIN</button>
  <button class="btn danger" id="logout">Sair</button>
 </div>

 <div id="paneTasks">
  <div class="pad"><input type="search" id="search" placeholder="🔍 Pesquisar demandas..." aria-label="Pesquisar"></div>
  <div class="chips" id="filters">

function compress(file,max=720,q=.6){
 return new Promise((res,rej)=>{
  if(!file)return res(null);
  const url=URL.createObjectURL(file),i=new Image();
  i.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
  i.onload=()=>{try{
   let m=max,qq=q,out;
   for(let n=0;n<4;n++){
    const k=Math.min(1,m/Math.max(i.naturalWidth,i.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(i.naturalWidth*k));c.height=Math.max(1,Math.round(i.naturalHeight*k));
    c.getContext('2d').drawImage(i,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',qq);
    if(out.length<200000)break;m*=.8;qq=Math.max(.35,qq-.08);
   }
   URL.revokeObjectURL(url);res(out)}catch(e){rej(e)}};
  i.src=url})}

/* ---------- sync (Firebase Firestore, tempo real) ---------- */
function setSync(st){const b=$('sync');b.className='badge '+st;b.textContent={on:'Online',off:'Offline',sync:'Sincronizando…'}[st];S.online=st==='on'}
const known={users:new Map(),tasks:new Map()},ready={users:false,tasks:false};
const clean=o=>JSON.parse(JSON.stringify(o));
function showErr(e){
 const m=e&&e.code==='permission-denied'?'Sem permissão no Firestore. Publique as regras na aba Regras do Firebase.':(e&&e.message)||String(e);
 lastErr=m;setSync('off');const b=$('errBar');b.textContent='⚠ '+m;b.classList.remove('hidden')}
function clearErr(){lastErr='';$('errBar').classList.add('hidden')}
function push(){
 if(!db)return Promise.resolve(false);
 const jobs=[];
 for(const col of ['users','tasks']){
  if(!ready[col])continue;
  const ids=new Set();
  S[col].forEach(it=>{ids.add(it.id);const c=clean(it);
   if(known[col].get(it.id)!==JSON.stringify(c))jobs.push(db.collection(col).doc(it.id).set(c))});
  known[col].forEach((v,id)=>{if(!ids.has(id))jobs.push(db.collection(col).doc(id).delete())});
 }
 return Promise.all(jobs).then(()=>{if(jobs.length)clearErr();return true}).catch(e=>{showErr(e);return false});
}
function listen(col){
 db.collection(col).onSnapshot(snap=>{
  const arr=[];known[col]=new Map();
  snap.forEach(d=>{const v={...d.data(),id:d.id};arr.push(v);known[col].set(d.id,JSON.stringify(v))});
  const first=!ready[col];ready[col]=true;
  if(first&&!arr.length&&S[col].length){push();return}
  if(col==='tasks'&&!S.admin){const pv=new Map(S.tasks.map(t=>[t.id,t.status]));arr.forEach(t=>{if(t.assignee_id===S.active&&pv.get(t.id)==='EM VALIDAÇÃO'&&t.status==='CONCLUÍDO'){const g=XP[t.priority]||100;toast('✅ Aprovada! +'+g+' XP');celebrate(g,0)}})}
  S[col]=arr;if(!me()&&S.users.length)S.active=S.users[0].id;
  persist();clearErr();setSync(snap.metadata.fromCache&&!navigator.onLine?'off':'on');renderAll();
 },err=>{showErr(err);console.warn(err)});
}
function pull(manual){
 if(!db){setSync('off');if(manual)toast('Firebase não configurado. Cole o firebaseConfig no código.');return}
 if(manual)toast(lastErr?'Erro: '+lastErr:(S.online?'Sincronizado em tempo real ✔':'Reconectando…'));

 if(!list.length){$('tasks').innerHTML='<div class="empty">Nenhuma demanda por aqui.'+(S.admin?' Toque em “+ Demanda” para criar.':'')+'</div>';return}

  </div></article>`}).join('')}

/* ---------- celebração ---------- */
function confetti(n){
 const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
 const x=c.getContext('2d'),cols=['#fbbf24','#f59e0b','#ef4444','#fff','#10b981','#fef08a'];
 const P=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
 let t=0;(function loop(){t++;x.clearRect(0,0,c.width,c.height);
  P.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
  t<130?requestAnimationFrame(loop):c.remove()})()}

 const f=document.createElement('div');f.className='xpfloat';f.textContent='+'+gain+' XP';document.body.appendChild(f);setTimeout(()=>f.remove(),1700);
 if(!rm)confetti(level?170:90);
 if(level){const o=document.createElement('div');o.className='lvlup';o.innerHTML=`<div><small>Subiu de nível!</small><b>NÍVEL ${level}</b><span>${titleOf(level)}</span></div>`;o.onclick=()=>o.remove();document.body.appendChild(o);setTimeout(()=>o.remove(),3000)}
 if(navigator.vibrate)try{navigator.vibrate(level?[60,40,60,40,120]:40)}catch{}
}

async function saveTask(){
 const desc=$('tDesc').value.trim();if(desc.length<3)return fail('tErr','Descreva a demanda (mínimo 3 letras).');
 let img=null;try{img=await compress($('tImg').files[0])}catch{return fail('tErr','Não foi possível ler a imagem.')}
 const id=$('tId').value,data={assignee_id:$('tAssignee').value,description:desc,priority:$('tPrio').value,deadline:$('tDate').value||null};
 if(id){const t=S.tasks.find(x=>x.id===id);Object.assign(t,data);if(img)t.admin_image=img}
 else S.tasks.push({id:uid('t'),...data,status:'PENDENTE',admin_image:img,user_image:null,comment:null,created_at:new Date().toISOString(),done_at:null});
 persist();closeAll();renderAll();toast(id?'Demanda atualizada':'Demanda criada');push()}
let dPhotos=[];
function renderPrev(){$('dPrev').innerHTML=dPhotos.map((u,i)=>`<div class="ph"><img class="thumb" alt="Prévia" src="${u}"><button type="button" data-rm="${i}" aria-label="Remover foto">✕</button></div>`).join('');$('camBtn').textContent=dPhotos.length<3?(dPhotos.length?'📷 Tirar outra foto':'📷 Abrir câmera'):'📷 Máximo de 3 fotos'}
async function finish(){
 const t=S.tasks.find(x=>x.id===$('dId').value);if(!t||t.status!=='PENDENTE')return closeAll();
 if(!dPhotos.length)return fail('dErr','Tire pelo menos 1 foto para enviar.');
 t.user_images=[...dPhotos];t.user_image=dPhotos[0];t.comment=$('dComment').value.trim()||null;
 t.status='EM VALIDAÇÃO';t.done_at=new Date().toISOString();t.done_day=today();t.reject_reason=null;
 persist();closeAll();renderAll();toast('📤 Enviando…');
 const r=await Promise.race([push(),new Promise(ok=>setTimeout(()=>ok('timeout'),8000))]);
 toast(r===true?'📤 Enviado! Aguarde a validação do gestor':r==='timeout'?'Sem internet: será enviado quando conectar':!db?'Salvo só neste aparelho (Firebase não configurado)':'Erro ao enviar. Veja o aviso no topo.')}
function approve(id){
 const t=S.tasks.find(x=>x.id===id);if(!t||t.status!=='EM VALIDAÇÃO')return;
 const u=S.users.find(x=>x.id===t.assignee_id);if(!u)return;
 const gain=XP[t.priority]||100,d=t.done_day||today();u.xp+=gain;
 if(!u.last_done||d>u.last_done){u.streak=(u.last_done&&daysBetween(u.last_done,d)===1)?u.streak+1:1;u.last_done=d}
 t.status='CONCLUÍDO';t.validated_at=new Date().toISOString();
 persist();renderAll();toast(`✅ Aprovada! +${gain} XP para ${u.name}`);push()}
function reject(){
 const t=S.tasks.find(x=>x.id===$('rId').value);if(!t)return closeAll();
 t.status='PENDENTE';t.reject_reason=$('rReason').value.trim()||'Refaça e envie uma nova foto.';t.user_images=[];t.user_image=null;t.comment=null;
 persist();closeAll();renderAll();toast('Demanda devolvida ao membro');push()}
async function verify(){
 const h=await sha($('aPin').value);const stored=localStorage.getItem('express_admin_pin_hash')||DEFAULT_PIN_HASH;
 if(h!==stored)return fail('aErr','PIN incorreto.');
 S.admin=true;$('aPin').value='';closeAll();renderAll();toast('Modo gestor ativado')}
async function changePin(){
 const stored=localStorage.getItem('express_admin_pin_hash')||DEFAULT_PIN_HASH;
 if(await sha($('pOld').value)!==stored)return fail('pErr','PIN atual incorreto.');
 if(!/^\d{4,8}$/.test($('pNew').value))return fail('pErr','O novo PIN deve ter de 4 a 8 dígitos.');
 localStorage.setItem('express_admin_pin_hash',await sha($('pNew').value));$('pOld').value=$('pNew').value='';closeAll();toast('PIN atualizado')}
function addUser(){
 const name=$('uName').value.trim();if(name.length<2)return fail('uErr','Informe o nome.');
 if(S.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return fail('uErr','Já existe um membro com esse nome.');
 S.users.push({id:uid('u'),name,role:$('uRole').value.trim()||'Colaborador',xp:0,streak:0,last_done:null});
 $('uName').value=$('uRole').value='';persist();closeAll();renderAll();toast('Membro cadastrado');push()}
function remote(){}
function exportData(){
 const b=new Blob([JSON.stringify({users:S.users,tasks:S.tasks,at:new Date().toISOString()},null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='demandas-express-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(f){
 if(!f)return;const r=new FileReader();r.onload=()=>{try{
  const d=JSON.parse(r.result);if(!Array.isArray(d.users)||!Array.isArray(d.tasks))throw 0;
  if(!confirm('Substituir os dados atuais pelo backup?'))return;
  S.users=d.users;S.tasks=d.tasks;if(!me())S.active=S.users[0]?.id;persist();renderAll();toast('Backup restaurado');push()}
  catch{toast('Arquivo de backup inválido')}};r.readAsText(f)}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-done],[data-ok],[data-no],[data-edit],[data-del],[data-deluser],[data-zoom],[data-open],[data-close],[data-f],[data-tab]');if(!t)return;
 if(t.dataset.done){$('dId').value=t.dataset.done;$('dComment').value='';dPhotos=[];renderPrev();$('dErr').textContent='';open('mFinish');$('dImg').click()}
 else if(t.dataset.ok)approve(t.dataset.ok);
 else if(t.dataset.no){$('rId').value=t.dataset.no;$('rReason').value='';open('mReject')}
 else if(t.dataset.edit)openTask(S.tasks.find(x=>x.id===t.dataset.edit));
 else if(t.dataset.del){if(confirm('Excluir esta demanda?')){S.tasks=S.tasks.filter(x=>x.id!==t.dataset.del);persist();renderAll();remote('tasks',t.dataset.del);toast('Demanda excluída')}}
 else if(t.dataset.deluser){const id=t.dataset.deluser;if(S.users.length<2)return toast('Mantenha ao menos um membro');
  if(confirm('Remover membro e suas demandas?')){S.tasks.filter(x=>x.assignee_id===id).forEach(x=>remote('tasks',x.id));S.tasks=S.tasks.filter(x=>x.assignee_id!==id);S.users=S.users.filter(x=>x.id!==id);remote('users',id);if(S.active===id)S.active=S.users[0].id;persist();renderAll()}}
 else if(t.dataset.zoom){$('bigImg').src=t.src;open('mImg')}
 else if(t.dataset.open==='task')openTask();
 else if(t.dataset.open==='user'){$('uErr').textContent='';open('mUser')}
 else if(t.dataset.open==='pin'){$('pErr').textContent='';open('mPin')}
 else if('close' in t.dataset)closeAll();
 else if(t.dataset.f){S.filter=t.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===t?'true':'false'));renderTasks()}
 else if(t.dataset.tab){S.tab=t.dataset.tab;$('tabT').setAttribute('aria-selected',S.tab==='tasks');$('tabR').setAttribute('aria-selected',S.tab==='rank');$('paneTasks').classList.toggle('hidden',S.tab!=='tasks');$('paneRank').classList.toggle('hidden',S.tab!=='rank')}
});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeAll()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if(e.key==='Enter'&&e.target.id==='aPin')verify()});
$('userSelect').onchange=e=>{S.active=e.target.value;localStorage.setItem('express_active_user',S.active);renderAll()};
$('search').oninput=renderTasks;
$('pinBtn').onclick=()=>{$('aErr').textContent='';open('mAuth')};
$('enter').onclick=verify;$('saveTask').onclick=saveTask;$('confirmDone').onclick=finish;
$('saveUser').onclick=addUser;$('savePin').onclick=changePin;
$('logout').onclick=()=>{S.admin=false;renderAll();toast('Saiu do modo gestor')};
$('exportBtn').onclick=exportData;$('importFile').onchange=e=>{importData(e.target.files[0]);e.target.value=''};
$('sync').onclick=()=>pull(true);
$('camBtn').onclick=()=>{if(dPhotos.length>=3)return toast('Máximo de 3 fotos');$('dImg').click()};
$('dImg').onchange=async e=>{const inp=e.target,f=inp.files[0];if(!f)return;if(dPhotos.length>=3){inp.value='';return}
 try{dPhotos.push(await compress(f));$('dErr').textContent='';renderPrev()}catch{toast('Não foi possível ler a foto. Tente de novo.')}
 inp.value=''};
$('dPrev').onclick=e=>{const b=e.target.closest('[data-rm]');if(b){dPhotos.splice(+b.dataset.rm,1);renderPrev()}};
$('confirmReject').onclick=reject;
$('goVal').onclick=()=>{$('tabT').click();document.querySelector('[data-f="VALIDAR"]').click();$('tasks').scrollIntoView({behavior:'smooth'})};
window.addEventListener('offline',()=>setSync('off'));window.addEventListener('online',()=>setSync(db?'sync':'off'));

document.addEventListener('click',e=>{const g=e.target.closest('[data-badge]');if(!g)return;const i=+g.dataset.badge,b=BADGES[i],u=me();toast(`${b[0]} ${b[1]}: ${b[2]}${earnedOf(u)[i]?' ✔':' 🔒'}`)});
renderAll();startSync();
</script>
</body>
